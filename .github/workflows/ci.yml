name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'safe-to-review'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full git history for commit and branch scanning
          fetch-depth: 0

      - name: Run Gitleaks secret scanner
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run secret heuristic scan
        run: python scripts/check_secrets_heuristic.py

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "npm"

      - name: Validate JavaScript syntax
        # Dynamically validate syntax across tracked Node.js source files without early abort
        run: |
          failed_files=0
          while IFS= read -r -d '' file; do
            if ! node --check "$file"; then
              echo "::error file=$file::JavaScript syntax check failed for $file"
              failed_files=$((failed_files + 1))
            fi
          done < <(git ls-files -z -- '*.js')
          if [ "$failed_files" -ne 0 ]; then
            echo "::error::Total files with JavaScript syntax errors: $failed_files"
            exit 1
          fi

      - name: Audit npm dependencies
        # Audits package-lock.json before npm ci to prevent installing unapproved packages
        run: python scripts/check_npm_audit.py

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Node.js unit tests
        run: npm test

      - name: Run Python unit tests
        run: python -m unittest discover tests

      - name: Verify Docker container build
        timeout-minutes: 5
        run: docker build -t kiara-bot:ci .
