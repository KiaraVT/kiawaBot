name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # Full git history is required for Gitleaks commit scanning
          fetch-depth: 0

      - name: Run Gitleaks secret scanner
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: "npm"

      - name: Validate JavaScript syntax
        # Dynamically validate syntax across tracked Node.js source files
        run: |
          git ls-files -z "*.js" | xargs -0 -n 1 node --check

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Node.js unit tests
        run: npm test

      # Advisory audit check documented in README.md; triaged via Dependabot
      - name: Advisory npm audit check
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run secret heuristic scan
        run: python scripts/check_secrets_heuristic.py

      - name: Run Python unit tests
        run: python -m unittest discover tests

      - name: Verify Docker container build
        run: docker build -t kiara-bot:ci .
