name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # Full git history for commit and branch scanning
          fetch-depth: 0

      - name: Run Gitleaks secret scanner
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Run secret heuristic scan
        run: python scripts/check_secrets_heuristic.py

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: "npm"

      - name: Validate JavaScript syntax
        # Dynamically validate syntax across tracked Node.js source files without early abort
        run: |
          errors=0
          while IFS= read -r -d '' file; do
            if ! node --check "$file"; then
              echo "::error file=$file::JavaScript syntax check failed for $file"
              errors=$((errors + 1))
            fi
          done < <(git ls-files -z -- '*.js')
          if [ "$errors" -ne 0 ]; then
            echo "::error::Total JavaScript syntax errors encountered: $errors"
            exit 1
          fi

      - name: Audit npm dependencies
        # Audits package-lock.json before npm ci to prevent installing unapproved packages
        run: python scripts/check_npm_audit.py

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Node.js unit tests
        run: npm test

      - name: Run Python unit tests
        run: python -m unittest discover tests

      - name: Verify Docker container build
        timeout-minutes: 5
        run: docker build -t kiara-bot:ci .
