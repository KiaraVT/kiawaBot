name: security-review-pr

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

concurrency:
  group: security-review-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions:
  actions: read
  checks: write
  contents: read
  pull-requests: write

jobs:
  resolve-pr:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.resolve.outputs.found }}
      same_repo: ${{ steps.resolve.outputs.same_repo }}
      safe_to_review: ${{ steps.resolve.outputs.safe_to_review }}
      already_reviewed: ${{ steps.resolve.outputs.already_reviewed }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      head_repo_url: ${{ steps.resolve.outputs.head_repo_url }}
      head_repo_full_name: ${{ steps.resolve.outputs.head_repo_full_name }}
    steps:
      - name: Resolve pull request from workflow run head
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const workflowRun = context.payload.workflow_run;
            const headSha = workflowRun?.head_sha;
            if (!/^[0-9a-f]{40}$/.test(headSha || "")) {
              core.setOutput("found", "false");
              core.setOutput("same_repo", "false");
              core.setOutput("safe_to_review", "false");
              core.setFailed("workflow run head SHA is invalid");
              return;
            }

            const pullRequests = await github.paginate(
              github.rest.pulls.list,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open",
                per_page: 100,
              },
            );
            const baseRepository = `${context.repo.owner}/${context.repo.repo}`;
            const candidates = pullRequests.filter((pullRequest) =>
              pullRequest.base?.repo?.full_name?.toLowerCase() ===
              baseRepository.toLowerCase() &&
              pullRequest.head?.sha?.toLowerCase() === headSha.toLowerCase()
            );
            if (candidates.length !== 1) {
              core.setOutput("found", "false");
              core.setOutput("same_repo", "false");
              core.setOutput("safe_to_review", "false");
              core.setFailed(
                `expected one pull request for workflow run head, found ${candidates.length}`,
              );
              return;
            }

            const pullRequest = candidates[0];
            const headRepository = pullRequest.head?.repo;
            if (!headRepository?.full_name || !headRepository.clone_url) {
              core.setOutput("found", "false");
              core.setOutput("same_repo", "false");
              core.setOutput("safe_to_review", "false");
              core.setFailed("pull request head repository metadata is unavailable");
              return;
            }

            const getRun = async (runId) => {
              const { data } = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
              });
              return data;
            };
            const hasTrustedVerdictRecord = async (sha) => {
              const name = `security-review-verdict-${sha}`;
              const artifacts = await github.paginate(
                github.rest.actions.listArtifactsForRepo,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  per_page: 100,
                },
              );
              const records = artifacts.filter((artifact) =>
                artifact.name === name &&
                !artifact.expired &&
                artifact.workflow_run?.id
              );
              if (records.length === 0) {
                return false;
              }
              const trustedPath = (await getRun(context.runId)).path;
              const defaultBranch = context.payload.repository?.default_branch;
              for (const record of records) {
                const producer = await getRun(record.workflow_run.id);
                if (
                  producer.event === "workflow_run" &&
                  producer.path === trustedPath &&
                  Boolean(defaultBranch) &&
                  producer.head_branch === defaultBranch
                ) {
                  return true;
                }
              }
              return false;
            };

            const checkRuns = await github.paginate(
              github.rest.checks.listForRef,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: headSha,
                check_name: "security-review",
                per_page: 100,
              },
            );
            const hasVerdictCheck = checkRuns.some((run) =>
              run.status === "completed" &&
              /VERDICT: (APPROVE|BLOCK|NEEDS-HUMAN)\b/.test(
                run.output?.summary || ""
              )
            );
            const alreadyReviewed = hasVerdictCheck &&
              await hasTrustedVerdictRecord(headSha);
            core.setOutput("already_reviewed", alreadyReviewed ? "true" : "false");
            const sameRepo =
              headRepository.full_name.toLowerCase() === baseRepository.toLowerCase()
                ? "true"
                : "false";
            let safeToReview = false;
            try {
              const { data: prData } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullRequest.number,
              });
              const labels = (prData.labels || []).map((l) => (typeof l === "string" ? l : l.name));
              safeToReview = labels.includes("safe-to-review");
            } catch (error) {
              const message = String(error?.message || error)
                .replace(/[\r\n\x00-\x1f\x7f]/g, " ")
                .slice(0, 500);
              core.setOutput("found", "false");
              core.setOutput("same_repo", sameRepo);
              core.setOutput("safe_to_review", "false");
              core.setOutput("pr_number", String(pullRequest.number));
              core.setOutput("base_sha", pullRequest.base.sha);
              core.setOutput("head_sha", pullRequest.head.sha);
              core.setOutput("head_repo_url", headRepository.clone_url);
              core.setOutput("head_repo_full_name", headRepository.full_name);
              core.setFailed(`could not fetch current pull request labels: ${message}`);
              return;
            }
            core.setOutput("found", "true");
            core.setOutput("same_repo", sameRepo);
            core.setOutput("safe_to_review", safeToReview ? "true" : "false");
            core.setOutput("pr_number", String(pullRequest.number));
            core.setOutput("base_sha", pullRequest.base.sha);
            core.setOutput("head_sha", pullRequest.head.sha);
            core.setOutput("head_repo_url", headRepository.clone_url);
            core.setOutput("head_repo_full_name", headRepository.full_name);

  # Same-repository review maps repository-level OLLAMA_API_KEY or MODEL_API_KEY.
  review:
    needs: resolve-pr
    if: |
      needs.resolve-pr.result == 'success' &&
      needs.resolve-pr.outputs.found == 'true' &&
      needs.resolve-pr.outputs.same_repo == 'true' &&
      needs.resolve-pr.outputs.already_reviewed != 'true'
    uses: abuzucom/foucault/.github/workflows/security-review.yml@f58255c8d75658e62e7cff9b607c13aeab5f5e18
    with:
      audit_ref: "f58255c8d75658e62e7cff9b607c13aeab5f5e18"
      model_call_command: "python3 ci/call_model.py"
      pr_comment: true
      fail_on_block: true
      pr_number: ${{ needs.resolve-pr.outputs.pr_number }}
      base_sha: ${{ needs.resolve-pr.outputs.base_sha }}
      head_sha: ${{ needs.resolve-pr.outputs.head_sha }}
      head_repo_url: ${{ needs.resolve-pr.outputs.head_repo_url }}
      head_repo_full_name: ${{ needs.resolve-pr.outputs.head_repo_full_name }}
    secrets:
      MODEL_API_KEY: ${{ secrets.OLLAMA_API_KEY || secrets.MODEL_API_KEY }}

  review-fork:
    needs: resolve-pr
    if: |
      needs.resolve-pr.result == 'success' &&
      needs.resolve-pr.outputs.found == 'true' &&
      needs.resolve-pr.outputs.same_repo == 'false' &&
      needs.resolve-pr.outputs.safe_to_review == 'true' &&
      needs.resolve-pr.outputs.already_reviewed != 'true'
    # Upstream reusable workflow activates the fork-review environment gate
    # when fork_review is true. Caller jobs cannot declare environment directly.
    uses: abuzucom/foucault/.github/workflows/security-review.yml@f58255c8d75658e62e7cff9b607c13aeab5f5e18
    with:
      audit_ref: "f58255c8d75658e62e7cff9b607c13aeab5f5e18"
      model_call_command: "python3 ci/call_model.py"
      pr_comment: true
      fail_on_block: true
      pr_number: ${{ needs.resolve-pr.outputs.pr_number }}
      base_sha: ${{ needs.resolve-pr.outputs.base_sha }}
      head_sha: ${{ needs.resolve-pr.outputs.head_sha }}
      head_repo_url: ${{ needs.resolve-pr.outputs.head_repo_url }}
      head_repo_full_name: ${{ needs.resolve-pr.outputs.head_repo_full_name }}
      # Select the upstream reusable workflow's fork-review environment path
      fork_review: true
    secrets:
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}

  fork-review-skipped:
    needs: resolve-pr
    if: |
      needs.resolve-pr.result == 'success' &&
      needs.resolve-pr.outputs.found == 'true' &&
      needs.resolve-pr.outputs.same_repo == 'false' &&
      needs.resolve-pr.outputs.safe_to_review != 'true'
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: Publish skip result
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ needs.resolve-pr.outputs.head_sha }}
        with:
          script: |
            await github.rest.checks.create({
              ...context.repo,
              name: 'security-review',
              head_sha: process.env.HEAD_SHA,
              status: 'completed',
              conclusion: 'skipped',
              output: {
                title: 'Skipped for fork pull request',
                summary: 'Fork pull requests require the safe-to-review label and maintainer environment approval.',
              },
            });

  annotate:
    needs: [resolve-pr, review, review-fork]
    if: |
      !cancelled() &&
      needs.resolve-pr.result == 'success' &&
      needs.resolve-pr.outputs.found == 'true' &&
      ((needs.resolve-pr.outputs.same_repo == 'true' &&
        (needs.review.result == 'success' || needs.review.result == 'failure')) ||
       (needs.resolve-pr.outputs.same_repo == 'false' &&
        (needs.review-fork.result == 'success' || needs.review-fork.result == 'failure')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Annotate review comment with policy document link
        uses: ./.github/actions/annotate-pr-review
        with:
          pr-number: ${{ needs.resolve-pr.outputs.pr_number }}
          doc-path: "docs/pr-security-review.md"
          policy-name: "Security review"
          markers: "Security review metadata,<!-- foucault-security-review -->"
