<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Twitch Chat</title>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <style>
            html, body {
                overflow: hidden;
                margin: 0;
                padding: 0;
            }
            
            html {
                font-size: 30px;
                line-height: 1.2;
            }
            
            img {
                vertical-align: middle;
            }
            
            .emote {
                width: 1.5rem;
                aspect-ratio: 1;
            }
            
            .badges {
                width: 1rem;
                aspect-ratio: 1;
                margin-right: 2px;
                position: relative;
                bottom: 2px;
                flex-shrink: 0;
            }
            
            .emote-big {
                width: 4rem;
                aspect-ratio: 1;
            }
            
            .emote-special {
                width: 4rem;
            }
            
            #chat-messages {
                vertical-align: bottom;
                height: 100vh;
                width: 100vw;
                overflow: hidden;
                display: flex;
                align-items: start;
                justify-content: end;
                flex-direction: column;

                --animation-speed: 300ms;
                --animation-timing-function: ease-out;
                --max-message-lines: 1; /* overwritten by JS updateMaxMessageLines */
            }
            
            /* display:grid on each message lets us animate from 0fr height to 1fr height (think of it as 0% to 100%) */
            .chat-message {
                display: grid;
                /* workaround/hack because 0fr by itself still expands to minmax(auto, 0fr) which allows content to increase the minimum height */
                grid-template-rows: minmax(0, 0fr);
                transition: grid-template-rows var(--animation-speed) var(--animation-timing-function);
            }

            .chat-message.chat-message-visible {
                grid-template-rows: minmax(auto, 1fr);
            }

            .chat-message-inner {
                overflow: hidden;
                min-height: 0;
                padding: 0;
                color: white;
                font-family: sans-serif;
                font-weight: 600;
                font-size: 1rem;
                -webkit-text-stroke: 1px black;
                opacity: 0;
                transition: opacity var(--animation-speed) var(--animation-timing-function);
            }

            .chat-message.chat-message-visible .chat-message-inner {
                opacity: 1;
            }

            /* Vertical layout has these message sub-elements flow in order like natural text. Horizontal layout later on these styles needs to treat them differently. */
            .chat-message-header, .chat-message-body {
                display: inline;
            }

            /* Short, wide windows (3:1 aspect ratio or wider) switch to a horizontal layout. */
            @media (min-aspect-ratio: 3/1) {
                #chat-messages {
                    flex-direction: row;
                    /* change this to affect the spacing between messages */
                    gap: 0.4rem;
                    column-rule: 0.4rem solid rgba(0, 0, 0, 0.5);
                }

                .chat-message {
                    display: block;
                    grid-template-rows: unset;
                    overflow: hidden;
                    max-width: 0;
                    flex-shrink: 0;
                    transition: max-width var(--animation-speed) var(--animation-timing-function);
                }

                .chat-message.chat-message-visible {
                    grid-template-rows: unset;
                    max-width: 10rem; /* change this to allow wider horizontal messages */
                }

                .chat-message-inner {
                    min-height: unset;
                    white-space: normal;
                    padding-inline: 0.5rem;
                }
                

                /* badges and username */
                .chat-message-header {
                    display: flex;
                    align-items: center;
                }

                /* --max-message-lines is computed in JS (see updateMaxBodyLines) from the widget's concrete height */
                .chat-message-body {
                    display: -webkit-box;
                    -webkit-box-orient: vertical;
                    -webkit-line-clamp: var(--max-message-lines);
                    overflow: hidden;
                    text-overflow: ellipsis;
                }

                .chat-message-username {
                    flex: 1 1 auto;
                    min-width: 0;
                    overflow: hidden;
                    text-overflow: ellipsis;
                    white-space: nowrap;
                }
            }
        </style>
      <script type="text/javascript">
        class ChatBotConnectionManager {
          /** @typedef {(messageEvent: MessageEvent<string>) => any} MessageHandler */
          
          /** @type {WebSocket} */
          #websocket;
          
          /** @type {URL} */
          #url;
          
          /** @type {MessageHandler} */
          #messageHandler;

          /**
           * 
           * @param {string | URL} url 
           * @param {MessageHandler} messageHandler 
           */
          constructor(url, messageHandler) {
            // save parameters for making new WebSockets now and possibly later
            this.#url = new URL(url);
            this.#messageHandler = messageHandler;
            
            // keep an eye on the WebSocket and reconnect it if needed
            setInterval(() => !this.#isConnected() && this.#reconnect(), 3000);
            // ...and start it up immediately instead of 3000 millis from now
            this.#reconnect();
          }
          
          #isConnected() {
            // don't wanna keep starting over if CONNECTING state takes longer than 3000 millis
            return [WebSocket.CONNECTING, WebSocket.OPEN, WebSocket.CLOSING].includes(this.#websocket?.readyState);
          }

          #reconnect() {
            try {
              this.#websocket?.close();
            }
            catch (e) {
              // don't care if closing fails; we're about to replace it one way or another
            }
            const ws = new WebSocket(this.#url);
            ws.onopen = event => {
              console.log("Connected to Kiara_bot!");
            };

            ws.onmessage = messageEvent => {
              this.#messageHandler?.(messageEvent)
            };

            ws.onclose = closeEvent => {
              console.log("Disconnected from Kiara_bot.  Should reconnect shortly.", closeEvent);
            };

            ws.onerror = event => {
              console.error("WebSocket error.  Should reconnect shortly.", event);
            };
            
            this.#websocket = ws;
          }
        }
        
        new ChatBotConnectionManager(`ws://${location.hostname}:8080`, event => {
          /** @type {({kiawaAction: string, [key: string]: any})} */
          const data = JSON.parse(event.data) ; // Parse the JSON string
          if (data.kiawaAction ==="Message_Delete"){
            handleMessageDelete(data.messageDelete)
          }
          else if (data.kiawaAction==="Mod_Action"){
            handleModAction(data.modAction)
          }
          else if(data.kiawaAction==="Message"){
          addMessage(data.tags, data.channel, data.message, data.messageBadges)
          }
          else{
            console.log('unhandled kiawa Action')
            console.log(data)
          }
        });

        //these variables are used to get to the emote image urls
        const urlFront="https://static-cdn.jtvnw.net/emoticons/v2/"
        const urlBack="/default/light/3.0"
        
        // Recalculates how many lines the window could show if it were in horizontal layout.
        // Runs but doesn't affect anything in vertical layout.
        function updateMaxMessageLines() {
            const chatMessagesElement = document.getElementById("chat-messages");
            if (!chatMessagesElement) {
                return;
            }
            const lineHeightPx = parseFloat(getComputedStyle(document.documentElement).lineHeight);
            const headerLines = 1; // badges and username on first line
            const availableLines = Math.floor(chatMessagesElement.clientHeight / lineHeightPx) - headerLines;
            const maxLines = Math.max(1, availableLines);
            chatMessagesElement.style.setProperty('--max-message-lines', maxLines.toString());
        }
        window.addEventListener('load', updateMaxMessageLines);
        window.addEventListener('resize', updateMaxMessageLines);
        
        /**
         * @param {string} html
         * @returns { HTMLElement | undefined }
         */
        function createElementFromHtml(html) {
            const el = document.createElement("div");
            try {
                el.innerHTML = html;
                
                if (el.children.length === 1) {
                    const onlyChild = el.children.item(0);
                    if (onlyChild instanceof HTMLElement) {
                        return onlyChild;
                    }
                }
                console.error("Expected a single outer HTML element, but either there were none, more, or it wasn't HTML.  Received:", html);
                return undefined;
            }
            finally {
                el.remove();
            }
        }

        //this function is used to sort an array high to low
        function compareStartIndex(a,b) {return b.startIndex - a.startIndex};

        function removeChatMessagesByUserId(userID) {
          console.log(userID);
          document.querySelectorAll(`.chat-message[userID="${userID}"]`).forEach(element => element.remove());
        }

        function removeChatMessagesByMessageId(messageID) {
          console.log(`.chat-message[messageID=${messageID}]`)
          document.querySelectorAll(`.chat-message[messageID="${messageID}"]`).forEach(element => element.remove());
        }

        // https://dev.twitch.tv/docs/eventsub/eventsub-reference/#channel-moderate-event-v2
        function handleModAction(event) {
          const action = event.action;
          if (["ban", "timeout", "warn"].includes(action)) {
            const userId = event[action].user_id;
            removeChatMessagesByUserId(userId);
          }
          if (["delete"].includes(action)) {
            const messageId = event[action].message_id;
            removeChatMessagesByMessageId(messageId);
          }
        }

        // https://dev.twitch.tv/docs/eventsub/eventsub-subscription-types/#channelchatmessage_delete
        function handleMessageDelete(event) {
          removeChatMessagesByMessageId(event.message_id);
        }
        
        // Function to add a new message to the chat window
        function addMessage(tags, username, message, messageBadges) {
          const chatMessages = document.getElementById('chat-messages');
          //pull the userid color
          let userColor=tags.color;
          const messageID=tags["message_id"];
          const userID=tags["chatter_user_id"];
          if (userColor===null){
            userColor='#bbbbbb'
          }
          if (username==='kiawa_bot'){
            userColor='#105584'
          }

          // Kiara_bot.js has already read tags.badges and picked out exactly what this message needs, so we can just read image URLs from the messageBadges
          const badgeIconElements = messageBadges.map(version => createElementFromHtml(`<img class="badges" src="${version.image_url_4x}" alt="">`));

          //run through the message fragments to build the chat message
          const messageParts=[];
          var messageFormatted="";
          console.log(tags.message.fragments);
          tags.message.fragments.forEach((fragment) =>{
            
            //if the header is an emote, this will pull the image and place it in the message to be displayed in the widget
            if (fragment.type=== "emote") {
              console.log('this is the emote section')
              //create the url to the emote image to be displayed
              const emoteURL=urlFront + fragment.emote.id + urlBack
              //the part before the emote code
              const emoteElement = document.createElement("img");
              emoteElement.src=emoteURL;

              //assign emote class for basic formatting
              emoteElement.classList.add("emote")

              //check if this was a big emote redeem, then assign the big emote class to enlarge
              if (tags["message_type"]==="power_ups_gigantified_emote"){
                  emoteElement.classList.add("emote-big")
              }
              const emoteHTML = emoteElement.outerHTML;
              messageParts.push(emoteHTML);
              
            }

            if (fragment.type==="cheermote") {
              //sanitize inputs so people can't just put an image in
              messageParts.push(fragment.text.replaceAll("<", "&lt;").replaceAll(">", "&gt;"));
            }
            //if the fragment is text, this just appends it onto our overall message
            if (fragment.type==="text" || fragment.type==="mention") {
              //sanitize inputs so people can't just put an image in
              messageParts.push(fragment.text.replaceAll("<", "&lt;").replaceAll(">", "&gt;"));
            }
          }
          )
          messageFormatted = messageParts.join("")
          messageFormatted = messageFormatted.replace(/\bSoStylish\b/g, "<img class='emote' src= 'https://cdn.betterttv.net/frankerfacez_emote/81792/4'>");
          messageFormatted = messageFormatted.replace(/\bcrabMissile\b/g, "<img class='emote' src= 'https://cdn.betterttv.net/frankerfacez_emote/31554/4'>");
          messageFormatted = messageFormatted.replace(/\bTitsAMe\b/g, "<img class='emote' src= 'https://cdn.betterttv.net/frankerfacez_emote/196494/4'>");
          messageFormatted = messageFormatted.replace(/\bkiawaSilvia\b/g, "<img class='emote-special' src= 'emotes/kiawaSilvia.png'>");
          const usernameElement = createElementFromHtml(`<span class="chat-message-username" style="color:${userColor}">${username}:</span>`);
          
          // Push the chat message to the webpage.
          // .chat-message is the outer element that grows/fades in.
          const newMessage = createElementFromHtml(`<div class="chat-message" messageID="${messageID}" userID="${userID}"></div>`);
          // .chat-message-inner holds the actual content.
          const newMessageInner = createElementFromHtml(`<div class="chat-message-inner"></div>`);
          // .chat-message-header (badges and username) and .chat-message-body (the message) need to be separate elements,
          // so they can flow differently in vertical and horizontal layouts.
          const newMessageHeader = createElementFromHtml(`<span class="chat-message-header"></span>`);
          const newMessageBody = createElementFromHtml(`<span class="chat-message-body">${messageFormatted}</span>`);
          
          newMessageHeader.append(...badgeIconElements);
          newMessageHeader.appendChild(usernameElement);
          
          newMessageInner.appendChild(newMessageHeader);
          newMessageInner.append(" ");
          newMessageInner.appendChild(newMessageBody);
          
          newMessage.appendChild(newMessageInner);
          
          chatMessages.appendChild(newMessage);

          //if chat messages exceed 30, trim the list down
          while (chatMessages.children.length > 30) {
              chatMessages.children[0].remove();
          }
          
          // If we're dropping messages, animate the topmost remaining child back to zero size before we remove them entirely next time.
          // Honestly probably doesn't matter given no current layouts can even show 30 to begin with (therefore the animation takes place entirely off-screen).
          if (chatMessages.children.length >= 30) {
              chatMessages.children[0].classList.remove("chat-message-visible");
          }

          // Need to wait just a moment for the initial collapsed height element to be drawn, before it can be animated from that state.  20ms is way overkill but still unnoticeable.
          setTimeout(() => newMessage.classList.add("chat-message-visible"), 20);
        }

        //next steps
        //custom avatars
        //add in badges (sub badges, mod icons, checkmarks, whatever)
        //add cool html effects like marquee
        //add cool way for text to enter scrollingElement (slide from left or right)
        //add in events (like subs, raids, cheers, etc. etc.)
        //sizing, size to custom resolutions to fit within layouts
        //fun things for events (TM)
        //assign a random color that persists through multiple chat messages

      </script>
    </head>
    <body>
      <div id="chat-messages">

      </div>

    </body>
    </html>
