services:
  kiara-bot:
    build: .
    container_name: kiara-bot
    restart: unless-stopped
    network_mode: "host"
    environment:
      - NODE_ENV=production
      - WEB_PORT=8081
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - bot_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    develop:
      watch:
        - path: ./webserver/www
          action: rebuild
        - path: ./
          action: rebuild


volumes:
  bot_logs:
    driver: local
